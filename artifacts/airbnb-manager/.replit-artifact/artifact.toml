kind = "mobile"
previewPath = "/"
title = "StayFlow – Airbnb Manager"
version = "1.0.0"
id = "artifacts/airbnb-manager"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18807

[services.development]
run = "pnpm --filter @workspace/airbnb-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/airbnb-manager", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/airbnb-manager/server/serve.js" ]

[services.production.run.env]
PORT = "18807"
BASE_PATH = "/"
NODE_ENV = "production"

[services.env]
PORT = "18807"
BASE_PATH = "/"
